<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catat pemasukan dan pengeluaran uang sakumu, lalu cari dan filter riwayat transaksi.">
  <title>Transaksi - Kasku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link href="./output.css" rel="stylesheet">
</head>
<body>
  <a href="#konten" class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:bg-white focus:px-3 focus:py-2">Lewati ke konten utama</a>

  <header class="sticky top-0 z-20 border-b border-line bg-paper/95 backdrop-blur">
    <nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4" aria-label="Navigasi utama">
      <a href="index.html" class="font-display text-2xl font-extrabold text-teal">Kasku</a>
      <ul id="menu" class="absolute left-0 right-0 top-full hidden flex-col gap-1 border-b border-line bg-paper p-6 md:static md:flex md:flex-row md:gap-8 md:border-0 md:bg-transparent md:p-0">
        <li><a class="block py-2 hover:text-teal aria-[current=page]:font-bold aria-[current=page]:text-teal" href="index.html">Beranda</a></li>
        <li><a class="block py-2 hover:text-teal aria-[current=page]:font-bold aria-[current=page]:text-teal" href="transaksi.html" aria-current="page">Transaksi</a></li>
        <li><a class="block py-2 hover:text-teal aria-[current=page]:font-bold aria-[current=page]:text-teal" href="anggaran.html">Anggaran</a></li>
        <li><a class="block py-2 hover:text-teal aria-[current=page]:font-bold aria-[current=page]:text-teal" href="kurs.html">Kurs</a></li>
        <li><a class="block py-2 hover:text-teal aria-[current=page]:font-bold aria-[current=page]:text-teal" href="masukan.html">Masukan</a></li>
      </ul>
      <button id="menu-btn" type="button" class="rounded-lg border border-line px-3 py-2 md:hidden" aria-expanded="false" aria-controls="menu">Menu</button>
    </nav>
  </header>

  <main id="konten" class="section">
    <h1 class="font-display text-4xl font-extrabold">Catat transaksi</h1>
    <p class="mt-3 max-w-prose">Data tersimpan di browser ini dan tidak dikirim ke mana pun.</p>

    <section class="mt-8 grid grid-cols-1 items-start gap-6 lg:grid-cols-3">
      <form id="tx-form" class="card" novalidate>
        <h2 class="font-display text-lg font-bold">Tambah transaksi</h2>

        <fieldset class="mt-4 min-w-0">
          <legend class="mb-2 font-bold">Jenis</legend>
          <p class="flex gap-6">
            <label class="flex items-center gap-2"><input type="radio" name="type" value="expense" checked class="accent-teal"> Pengeluaran</label>
            <label class="flex items-center gap-2"><input type="radio" name="type" value="income" class="accent-teal"> Pemasukan</label>
          </p>
        </fieldset>

        <label for="tx-desc" class="mb-1 mt-4 block font-bold">Keterangan</label>
        <input id="tx-desc" name="desc" type="text" maxlength="80" placeholder="Contoh: Makan siang kantin" class="field" aria-describedby="err-desc">
        <p id="err-desc" class="mt-1 min-h-5 text-sm text-expense" role="alert"></p>

        <label for="tx-category" class="mb-1 mt-2 block font-bold">Kategori</label>
        <select id="tx-category" name="category" class="field"></select>

        <label for="tx-amount" class="mb-1 mt-4 block font-bold">Jumlah (Rp)</label>
        <input id="tx-amount" name="amount" type="number" min="1" step="1" inputmode="numeric" placeholder="Contoh: 15000" class="field" aria-describedby="err-amount">
        <p id="err-amount" class="mt-1 min-h-5 text-sm text-expense" role="alert"></p>

        <label for="tx-date" class="mb-1 mt-2 block font-bold">Tanggal</label>
        <input id="tx-date" name="date" type="date" class="field" aria-describedby="err-date">
        <p id="err-date" class="mt-1 min-h-5 text-sm text-expense" role="alert"></p>

        <button type="submit" class="btn-primary mt-4 w-full">Simpan transaksi</button>
      </form>

      <section class="card lg:col-span-2" aria-labelledby="list-title">
        <header class="flex flex-wrap items-center justify-between gap-3">
          <h2 id="list-title" class="font-display text-lg font-bold">Riwayat transaksi</h2>
          <p id="tx-count" class="text-sm" aria-live="polite"></p>
        </header>

        <form class="mt-4 grid gap-3 sm:grid-cols-3" role="search" onsubmit="return false">
          <label class="sr-only" for="tx-search">Cari keterangan</label>
          <input id="tx-search" type="search" placeholder="Cari keterangan" class="field">
          <label class="sr-only" for="tx-filter-type">Filter jenis</label>
          <select id="tx-filter-type" class="field">
            <option value="semua">Semua jenis</option>
            <option value="expense">Pengeluaran</option>
            <option value="income">Pemasukan</option>
          </select>
          <label class="sr-only" for="tx-filter-cat">Filter kategori</label>
          <select id="tx-filter-cat" class="field"><option value="semua">Semua kategori</option></select>
        </form>

        <ul id="tx-list" class="mt-4 divide-y divide-line"></ul>
        <p id="tx-empty" class="py-8 text-center" hidden></p>

        <menu class="mt-4 flex flex-wrap gap-3">
          <li><button id="btn-sample" type="button" class="btn-outline">Muat data contoh</button></li>
          <li><button id="btn-clear" type="button" class="btn-outline">Hapus semua data</button></li>
        </menu>
        <p id="data-status" class="mt-3 min-h-6 text-sm font-bold" role="status" aria-live="polite"></p>
      </section>
    </section>
  </main>

  <footer class="bg-ink py-8 text-center text-paper">
    <p>&copy; 2026 Kasku. Praktikum Pemrograman Web, Universitas Muhammadiyah Malang.</p>
  </footer>

  <script type="module" src="./js/page-transaksi.js"></script>
</body>
</html>
